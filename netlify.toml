[build]
  command = "vite build"
  publish = "dist/client"
  functions = "dist/server"

[dev]
  command = "vite dev"
  port = 3000

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
